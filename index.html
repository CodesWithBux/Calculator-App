<!DOCTYPE html>
<html>
  <head>
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="background">
      <div class="calc-text">
        <p id="user-input">0</p>
        <p id="answer-input">0</p>
      </div>
      <div class="scientific-functions-area">
        <button class="sci-btn" data-value="pow" data-display="xʸ">xʸ</button>
        <button class="sci-btn" data-value="factorial" data-display="x!">x!</button>
        <button class="sci-btn" data-value="sqrt" data-display="&#x221A;">&#x221A;</button>
        <button class="sci-btn" data-value="square" data-display="x²">x²</button>
        <button class="sci-btn" data-value="exp" data-display="eʸ">eʸ</button>
        <button class="sci-btn" data-value="log10" data-display="log">log</button>
        <button class="sci-btn" data-value="pi" data-display="π">π</button>
        <button class="sci-btn" data-value="sin" data-display="sin">sin</button>
        <button class="sci-btn" data-value="cos" data-display="cos">cos</button>
        <button class="sci-btn" data-value="tan" data-display="tan">tan</button>
        <button class="sci-btn" data-value="(" data-display="(">(</button>
        <button class="sci-btn" data-value=")" data-display=")">)</button>

 

      </div>
      <br />
      <div class="keys">
        <button type="button" class="numbers" data-value="7">7</button>
        <button type="button" class="numbers" data-value="8">8</button>
        <button type="button" class="numbers" data-value="9">9</button>
        <button type="button" class="key-others operations" data-value="AC">AC</button>
        <button type="button" class="key-others operations" data-value="DEL">DEL</button>
        <button type="button" class="numbers" data-value="4">4</button>
        <button type="button" class="numbers" data-value="5">5</button>
        <button type="button" class="numbers" data-value="6">6</button>
        <button type="button" class="key-operate operations" data-value="x">x</button>
        <button type="button" class="key-operate operations" data-value="÷">÷</button>
        <button type="button" class="numbers" data-value="1">1</button>
        <button type="button" class="numbers" data-value="2">2</button>
        <button type="button" class="numbers" data-value="3">3</button>
        <button type="button" class="key-operate operations" data-value="+">+</button>
        <button type="button" class="key-operate operations" data-value="-">-</button>
        <button type="button" class="key-zero numbers" data-value="0">0</button>
        <button type="button" class="numbers" data-value=".">.</button>
        <button type="button" class="key-others operations" data-value="%">%</button>
        <button type="button" class="key-operate operations" data-value="=">=</button>
      </div>
    </div>

   <script src="./java.js"></script> 
 
  </body>
</html>
